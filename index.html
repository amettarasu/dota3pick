<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Дота 3 пик</title>
<meta name="theme-color" content="#0d0f13">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Rubik:wght@400;500;600&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0d0f13;--p1:#161a20;--p2:#1e232b;--ln:#2d343f;--fg:#ebe6da;--mut:#8f97a3;--gold:#d4a84b;--gold2:#8f6b22;--red:#c2402f;--grn:#4fae7b;--ac:var(--gold);--ac2:var(--red);--ac3:var(--grn);--bd:var(--ln);--glass:var(--p1);--d:Forum,"Times New Roman",Georgia,serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 480px at 50% -8%,#252c38 0,transparent 70%),radial-gradient(600px 400px at 100% 100%,#2a1512 0,transparent 70%),var(--bg);background-attachment:fixed;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(-7deg) scale(.85)}}
@keyframes flip{from{opacity:0;transform:rotateY(90deg) scale(.9)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes dot{40%{transform:translateY(-6px);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}}
#app{max-width:760px;margin:0 auto;padding:16px 16px 28px}
.screen{animation:in .3s ease-out}
h1{margin:.1em 0;font:400 2.2em/1.1 var(--d)}h2{margin:1.1em 0 .5em;font:400 1.3em var(--d);color:var(--gold)}
.logo{display:flex;align-items:center;gap:12px;color:#f2d98f;text-shadow:0 2px 18px #d4a84b44;animation:rise 1s ease-out}
.logo svg{width:44px;height:44px;flex:none}
.mut{color:var(--mut)}.center{text-align:center}.star{color:#e8a548;font-weight:600}
.glass{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:10px;box-shadow:inset 0 1px 0 #ffffff0d,0 10px 28px #0008}
.pad{padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
input[type=text],input:not([type]),select,textarea{flex:1;width:100%;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid var(--ln);background:#0f1216;color:var(--fg);font:inherit;margin:4px 0;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d4a84b33}
textarea{font:12px monospace;resize:vertical}
button{padding:11px 18px;border:1px solid #f0d58a55;border-radius:8px;background:linear-gradient(180deg,#e4bd60,#b78a2c);color:#1b1407;font:600 1em Rubik,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:inset 0 1px 0 #fff7,0 4px 14px #d4a84b2e;transition:transform .12s,filter .2s}
button:hover:not(:disabled){filter:brightness(1.1)}button:active:not(:disabled){transform:translateY(1px) scale(.99)}
button:disabled{opacity:.4;cursor:default;box-shadow:none}
button.ghost{background:#ffffff08;color:var(--fg);border:1px solid var(--ln);box-shadow:none;padding:9px 14px}
button.ghost:hover:not(:disabled){background:#ffffff12}
button:focus-visible,input:focus-visible,.pc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big{width:100%;margin-top:12px;padding:15px;font-size:1.05em}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p2);border:2px solid var(--ln);overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover}
label.avl{cursor:pointer;transition:transform .2s}label.avl:hover{transform:scale(1.07)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:8px 0;animation:in .35s backwards;animation-delay:calc(var(--i)*60ms)}
.code{font:400 3.4em/1.1 var(--d);letter-spacing:.25em;padding-left:.25em;cursor:pointer;color:var(--gold);text-shadow:0 0 28px #d4a84b55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin-top:14px}
.pc{position:relative;border-radius:12px;cursor:pointer;transition:transform .18s,box-shadow .2s;animation:deal .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*60ms)}
.pc:hover{transform:translateY(-4px)}
.pc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 16px 34px #d4a84b44}
.pc.off{opacity:.3;pointer-events:none;filter:grayscale(.8)}
.pc.rv{animation:flip .55s backwards;animation-delay:calc(var(--i)*110ms);cursor:default}
.pc .n{position:absolute;top:8px;left:8px;background:#0d0f13e8;border:1px solid var(--gold2);color:var(--gold);border-radius:6px;padding:0 9px;font:400 1.1em var(--d);z-index:2}
.card{aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;container-type:inline-size;background-color:#8884;background-size:cover;background-position:center;box-shadow:0 6px 18px #000a}
.card::before{content:"";position:absolute;inset:5px;border:1px solid #ffffff55;border-radius:8px;z-index:1;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff4 0,#fff0 35%,#0000 70%,#0003 100%);pointer-events:none}
.card i{position:absolute;font-style:normal;line-height:1;filter:drop-shadow(0 4px 6px #0004)}
.gate{text-align:center;padding:9vh 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.chips .av{animation:pop .3s backwards}
.cap{text-align:center;font-size:.85em;margin-top:8px;color:var(--mut)}
.tb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.tp{position:relative}.tp.wr .av{border-color:var(--gold);box-shadow:0 0 0 3px #d4a84b55,0 0 18px #d4a84b66}
.tp .bd,.tp .ok{position:absolute;right:-6px;bottom:-4px;background:var(--gold);color:#1b1407;border-radius:8px;padding:0 6px;font-size:.75em;font-weight:700;line-height:1.5}
.tp .ok{top:-6px;bottom:auto;background:var(--grn);color:#06140d}
.bar{height:6px;border-radius:6px;background:#0f1216;border:1px solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .5s}
.dots span{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:var(--gold);opacity:.4;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.sc{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:8px 0;animation:in .35s backwards;animation-delay:calc(var(--i)*60ms)}
.sc b.r{margin-left:auto;font:400 1.5em var(--d);color:var(--gold)}
.who{display:flex;align-items:center;gap:10px}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
details summary{cursor:pointer;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script></head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const EM="🐙 🦊 🌵 🚀 🎈 🍕 🌙 🔥 🐢 🎩 👻 🍄 🌈 🦄 🐳 🍓 ⚡ 🎸 🐝 🌻 🦉 🍩 🪐 🐸 🦋 🍉 🎲 🏰 ⛵ 🦖 🌋 🧸 🪁 🥕 🐌 🎪 🍦 🛸 🐧 🦁 🍔 ⚽ 🎃 🧙 🤖 👽 🐼 🍌".split(' ');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toImg=(f,w,h,q)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/i.width,h/i.height);x.drawImage(i,(w-i.width*k)/2,(h-i.height*k)/2,i.width*k,i.height*k);res(c.toDataURL('image/jpeg',q))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)});

/* карточки: 90 встроенных (id 0..89) + свои хоста (id 1000+), без ограничения */
const BUILT=Array.from({length:90},(_,i)=>{const h=i*47%360,N=EM.length;
 return{bg:`linear-gradient(${i*29%360}deg,hsl(${h},78%,62%),hsl(${(h+70)%360},72%,42%))`,
 e:[EM[i%N],EM[(i*7+3)%N],EM[(i*13+5)%N]],r:[i*17%40-20,i*11%30-15,i*23%50-25]}});
let custom=[];
const cardOf=id=>id<1000?BUILT[id]:{src:custom[id-1000]||''};
const cardEl=c=>'src'in c?`<div class="card" style="background-image:url('${c.src}')"></div>`:
 `<div class="card" style="background:${c.bg}"><i style="left:6%;top:6%;font-size:42cqw;transform:rotate(${c.r[0]}deg)">${c.e[0]}</i><i style="right:8%;top:40%;font-size:30cqw;transform:rotate(${c.r[1]}deg)">${c.e[1]}</i><i style="left:14%;bottom:5%;font-size:34cqw;transform:rotate(${c.r[2]}deg)">${c.e[2]}</i></div>`;
const av=(p,s)=>`<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.55}px">${p.av.startsWith('data:image/')?`<img src="${p.av}" alt="">`:esc(p.av.slice(0,4))}</span>`;

/* состояние */
let prof={name:'Игрок',av:EM[Math.random()*EM.length|0]};
try{Object.assign(prof,JSON.parse(localStorage.getItem('pm2p')||'{}'))}catch(e){}
const saveP=()=>{try{localStorage.setItem('pm2p',JSON.stringify(prof))}catch(e){}};
let isHost=false,me=0,P=[],slots=[],opts={builtin:true,circles:1},G=null,curKey='',busy=0;
let peer=null,hostConn=null,code='',joined=0;
const okAv=a=>typeof a==='string'&&a.length<5000?a:'🙂';
const toHost=m=>{try{hostConn.send(m)}catch(e){}};
const send=(p,m)=>p===0?setTimeout(()=>recv(m)):(slots.find(s=>s.p===p)||{send(){}}).send(m);
const bcast=m=>slots.forEach(s=>s.p!=null&&s.send(m));
const act=m=>isHost?hAct(0,m):toHost({t:'act',...m});
const noPeer=()=>typeof Peer==='undefined';
const rand4=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');

/* ---------- меню ---------- */
function menu(){
 isHost=false;G=null;hostConn=null;joined=0;P=[];slots=[];try{peer&&peer.destroy()}catch(e){}peer=null;
 app.innerHTML=`<div class="screen"><h1 class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#8f6b22" stroke-width="1.5"><rect x="5" y="9" width="21" height="31" rx="3" fill="#2a3340" transform="rotate(-14 15 24)"/><rect x="22" y="9" width="21" height="31" rx="3" fill="#7a2a22" transform="rotate(14 33 24)"/><rect x="13.5" y="6" width="21" height="33" rx="3" fill="#d4a84b"/></g><path d="M24 15l5 9-5 9-5-9z" fill="#1b1407"/></svg>Дота 3 пик</h1>
 <p class="mut">Рассказчик называет подсказку, остальные подкладывают подходящие карты, потом все угадывают карту рассказчика. Играйте вместе, каждый со своего телефона или компьютера.</p>
 ${noPeer()?'<p class="star">Не загрузилась библиотека соединения. Проверь интернет и обнови страницу (F5).</p>':''}
 <div class="glass pad"><h2 style="margin-top:0">Твой профиль</h2>
 <div class="row"><label class="avl">${av(prof,60)}<input type="file" accept="image/*" hidden onchange="setPAv(this)"></label>
 <input value="${esc(prof.name)}" maxlength="16" oninput="prof.name=this.value;saveP()">
 <button class="ghost" onclick="prof.av=EM[Math.random()*EM.length|0];saveP();menu()">🎲</button></div>
 <div class="mut">Нажми на аву, чтобы загрузить своё фото</div></div>
 <button class="big" onclick="hostNew()">Создать игру</button>
 <div class="glass pad" style="margin-top:16px"><h2 style="margin-top:0">Войти по коду</h2>
 <input id="ic" maxlength="4" placeholder="Код из 4 букв" style="text-transform:uppercase;font-size:1.6em;text-align:center;letter-spacing:.3em" onkeydown="if(event.key==='Enter')joinGo()">
 <button class="big" style="margin-top:6px" onclick="joinGo()">Войти</button><div id="ja"></div></div></div>`;
}
async function setPAv(inp){const f=inp.files[0];if(!f)return;const u=await toImg(f,56,56,.6);if(u){prof.av=u;saveP();menu()}}

/* ---------- гость ---------- */
function joinGo(){
 const c=document.getElementById('ic').value.toUpperCase().replace(/[^A-Z]/g,''),ja=document.getElementById('ja');
 if(c.length!==4)return alert('Введи 4 буквы кода комнаты');
 if(noPeer())return alert('Не загрузилась библиотека соединения. Проверь интернет и обнови страницу.');
 const fail=t=>{clearTimeout(to);ja.innerHTML=`<p class="star">${t}</p>`;try{peer.destroy()}catch(e){}};
 ja.innerHTML='<p class="mut center">Подключаемся <span class="dots"><span></span><span></span><span></span></span></p>';
 try{peer&&peer.destroy()}catch(e){}
 peer=new Peer();const to=setTimeout(()=>fail('Не удалось подключиться за 15 секунд. Проверь код и что хост уже создал игру. Если у кого-то VPN — выключите его.'),15000);
 peer.on('open',()=>{hostConn=peer.connect('pm2d-'+c.toLowerCase());
  hostConn.on('open',()=>{clearTimeout(to);hostConn.send({t:'join',name:prof.name,av:prof.av})});
  hostConn.on('data',recv);hostConn.on('close',()=>{alert('Связь с хостом потеряна');menu()})});
 peer.on('error',e=>fail(e.type==='peer-unavailable'?'Комната с таким кодом не найдена. Проверь код — хост должен уже создать игру.':'Ошибка соединения: '+e.type));
}
function recv(m){
 if(!m||typeof m!=='object')return;
 if(m.t==='lobby'){joined=1;isHost=false;P=m.P.map(p=>({name:String(p.name),av:okAv(p.av)}));me=m.you;lobby(m.note)}
 else if(m.t==='deck')custom=[];
 else if(m.t==='card')custom[m.i]=m.src;
 else if(m.t==='view')render(m.v);
}

/* ---------- хост: лобби ---------- */
function hostNew(){
 if(noPeer())return alert('Не загрузилась библиотека соединения. Проверь интернет и обнови страницу.');
 isHost=true;me=0;P=[{name:prof.name||'Хост',av:prof.av}];slots=[];custom=[];G=null;busy=0;
 app.innerHTML='<div class="gate screen"><h2>Создаём комнату</h2><div class="dots"><span></span><span></span><span></span></div></div>';
 const open=n=>{code=rand4();peer=new Peer('pm2d-'+code.toLowerCase());
  peer.on('open',()=>lobby());peer.on('connection',onConn);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&n<6){try{peer.destroy()}catch(x){}open(n+1)}else if(e.type!=='peer-unavailable'){alert('Не удалось создать комнату: '+e.type+'. Проверь интернет и выключи VPN.');menu()}})};
 open(0);
}
function onConn(c){
 const s={p:null,c,send:m=>{try{c.send(m)}catch(e){}}};slots.push(s);
 c.on('data',m=>m&&typeof m==='object'&&hMsg(s,m));c.on('close',()=>gone(s));c.on('error',()=>gone(s));
}
function hMsg(s,m){
 if(m.t==='join'){if(s.p!=null)return hLobby();if(G||P.length>=8)return;s.p=P.push({name:String(m.name||'Гость').slice(0,16),av:okAv(m.av)})-1;hLobby()}
 else if(m.t==='act'&&s.p!=null)hAct(s.p,m);
}
function gone(s){
 if(s.gone)return;s.gone=1;const i=slots.indexOf(s);if(i<0)return;slots.splice(i,1);
 if(s.p!=null){const nm=P[s.p].name;P.splice(s.p,1);slots.forEach(x=>{if(x.p>s.p)x.p--});G=null;busy=0;hLobby(nm+' вышел(а), игра остановлена')}
}
function hLobby(nt=''){slots.forEach(s=>s.p!=null&&s.send({t:'lobby',P,you:s.p,note:nt}));lobby(nt)}
function lobby(nt=''){
 curKey='';
 app.innerHTML=`<div class="screen"><h1 class="logo">Лобби</h1>${nt?`<p class="star">${esc(nt)}</p>`:''}
 ${isHost?`<div class="glass pad center"><div class="mut">Код комнаты — скажи друзьям</div><div class="code" onclick="try{navigator.clipboard.writeText('${code}')}catch(e){}" title="нажми, чтобы скопировать">${code}</div><div class="mut">${TG_LINK?`<button class="big" onclick="shareTG()">Пригласить друзей в Telegram</button>`:'Друзья вводят этот код в игре.'}</div></div>`:''}
 <h2>Игроки (${P.length}/8)</h2>${P.map((p,i)=>`<div class="glass pl" style="--i:${i}">${av(p,44)}<b>${esc(p.name)}</b>${i===0?' 👑':''}${i===me?' <span class="mut">(ты)</span>':''}</div>`).join('')}
 ${isHost?`<h2>Карточки</h2><div class="glass pad">
 <div class="row"><label><input type="checkbox" ${opts.builtin?'checked':''} onchange="opts.builtin=this.checked"> Встроенная колода (90 шт.)</label></div>
 <div class="row"><label class="ghost" style="padding:10px 14px;border-radius:14px;border:1px solid var(--bd);cursor:pointer">📁 Загрузить свои картинки<input type="file" accept="image/*" multiple hidden onchange="addCards(this)"></label>
 <span class="mut">Своих: ${custom.length}</span>${custom.length?'<button class="ghost" onclick="custom=[];lobby()">Очистить</button>':''}</div>
 <p class="mut" style="margin:4px 0">Можно сколько угодно: картинки обрежутся под формат 2:3 и сами передадутся друзьям при старте.</p>
 <div class="row"><select onchange="opts.circles=+this.value">${[1,2,3].map(k=>`<option value="${k}" ${opts.circles==k?'selected':''}>Кругов: ${k}</option>`).join('')}</select></div></div>
 <button class="big" onclick="hStart()" ${P.length<3?'disabled':''}>▶ Начать игру ${P.length<3?'(нужно минимум 3 игрока)':''}</button>`
 :'<div class="gate"><h2>Ждём, пока хост начнёт игру</h2><div class="dots"><span></span><span></span><span></span></div></div>'}</div>`;
}
async function addCards(inp){const fs=[...inp.files];for(let k=0;k<fs.length;k++){const u=await toImg(fs[k],200,300,.65);if(u)custom.push(u);if(k%10===9)await sleep(0)}lobby()}

/* ---------- хост: логика игры ---------- */
async function sendDeck(){
 bcast({t:'deck'});const N=custom.length;
 for(let i=0;i<N;i++){bcast({t:'card',i,src:custom[i]});
  while(slots.some(s=>s.c&&s.c.dataChannel&&s.c.dataChannel.bufferedAmount>1e6))await sleep(40);
  if(i%5===0||i===N-1){app.innerHTML=`<div class="gate screen"><h2>Раздаём карточки друзьям…</h2><div class="bar"><i style="width:${(i+1)/N*100}%"></i></div><p class="mut">${i+1} из ${N}</p></div>`;await sleep(0)}}
}
async function hStart(){
 if(busy)return;const n=P.length,ids=[];if(opts.builtin)for(let i=0;i<BUILT.length;i++)ids.push(i);custom.forEach((_,j)=>ids.push(1000+j));
 if(ids.length<n*6)return alert(`Нужно минимум ${n*6} карточек, сейчас ${ids.length}.`);
 busy=1;
 await sendDeck();if(!busy)return;
 G={deck:shuffle(ids),disc:[],hands:P.map(()=>[]),sc:P.map(()=>0),r:0,total:n*opts.circles};
 for(let k=0;k<5;k++)for(let i=0;i<n;i++)drw(i);
 busy=0;hRound();
}
function drw(i){if(!G.deck.length){G.deck=shuffle(G.disc);G.disc=[]}G.hands[i].push(G.deck.pop())}
function hRound(){G.w=G.r%P.length;G.ph='write';G.table=[];G.votes={};G.done=P.map(()=>false);push()}
function take(p,ci){if(!Number.isInteger(ci)||ci<0||ci>=G.hands[p].length)return false;G.table.push({c:G.hands[p].splice(ci,1)[0],o:p});return true}
function hAct(p,m){
 if(!G||m.ph!==G.ph||G.done[p])return;
 if(G.ph==='write'){if(p!==G.w||typeof m.clue!=='string'||!m.clue.trim()||!take(p,m.ci))return;G.clue=m.clue.trim().slice(0,60);G.done[p]=true;G.ph='play'}
 else if(G.ph==='play'){if(p===G.w||!take(p,m.ci))return;G.done[p]=true;
  if(G.done.every(Boolean)){G.table=shuffle(G.table);G.ph='vote';G.done=P.map((_,i)=>i===G.w)}}
 else if(G.ph==='vote'){if(p===G.w||!Number.isInteger(m.ci)||!G.table[m.ci]||G.table[m.ci].o===p)return;G.votes[p]=m.ci;G.done[p]=true;if(G.done.every(Boolean))hScore()}
 push();
}
function hScore(){
 const n=P.length,w=G.w,d=Array(n).fill(0),vs=Object.entries(G.votes).map(([p,c])=>[+p,c]);
 const wi=G.table.findIndex(t=>t.o===w),nf=vs.filter(v=>v[1]===wi).length;
 if(nf===0||nf===n-1)vs.forEach(v=>d[v[0]]+=2);else{d[w]+=3;vs.forEach(v=>{if(v[1]===wi)d[v[0]]+=3})}
 vs.forEach(v=>{const o=G.table[v[1]].o;if(o!==w)d[o]++});
 d.forEach((x,i)=>G.sc[i]+=x);G.d=d;G.nf=nf;G.ph='reveal';
}
function hNext(){
 G.table.forEach(t=>G.disc.push(t.c));for(let i=0;i<P.length;i++)while(G.hands[i].length<5)drw(i);
 G.r++;if(G.r>=G.total){G.ph='end';push()}else hRound();
}
function push(){P.forEach((_,p)=>send(p,{t:'view',v:{ph:G.ph,r:G.r,total:G.total,w:G.w,clue:G.clue||'',hand:G.hands[p],done:G.done,sc:G.sc,
 table:G.ph==='vote'?G.table.map(t=>t.c):null,dis:G.ph==='vote'?G.table.findIndex(t=>t.o===p):-1,
 rev:G.ph==='reveal'?{table:G.table,votes:G.votes,d:G.d,nf:G.nf}:null}}))}

/* ---------- экраны игры (у всех) ---------- */
const need=(v,i)=>v.ph==='write'?i===v.w:(v.ph==='play'||v.ph==='vote')?i!==v.w&&!v.done[i]:false;
const hdr=v=>`<div class="tb">${P.map((p,i)=>`<div class="tp ${i===v.w?'wr':''}" title="${esc(p.name)}${i===v.w?' — рассказчик':''}">${av(p,42)}<span class="bd">${v.sc[i]}</span>${(v.ph==='play'||v.ph==='vote')&&v.done[i]?'<span class="ok">✓</span>':''}</div>`).join('')}</div><div class="bar"><i style="width:${v.r/v.total*100}%"></i></div>`;
function render(v){
 const key=v.ph+v.r,pend=need(v,me);
 if(key===curKey&&pend)return;curKey=key;
 if(v.ph==='reveal')return reveal(v);
 if(v.ph==='end')return finish(v);
 if(!pend)return waitScr(v);
 const t=`Подсказка: «${esc(v.clue)}»`;
 if(v.ph==='write')pick({v,title:'🎤 Ты рассказчик: выбери карту и придумай подсказку',sub:'Не слишком очевидную и не слишком заумную — иначе очков не будет.',cards:v.hand,clue:1},(ci,clue)=>act({ph:'write',ci,clue}));
 else if(v.ph==='play')pick({v,title:t,sub:'Выбери карту, которая лучше всего подходит к подсказке и запутает остальных.',cards:v.hand},ci=>act({ph:'play',ci}));
 else pick({v,title:t,sub:'Какая карта принадлежит рассказчику? Свою выбрать нельзя.',cards:v.table,num:1,dis:v.dis},ci=>act({ph:'vote',ci}));
}
function waitScr(v){
 const w=v.ph==='write'?[v.w]:P.map((_,i)=>i).filter(i=>need(v,i));
 app.innerHTML=`<div class="screen">${hdr(v)}<div class="gate"><p class="mut">Раунд ${v.r+1} из ${v.total} · рассказчик: ${esc(P[v.w].name)}</p>${v.clue?`<h1 class="logo">«${esc(v.clue)}»</h1>`:''}<h2>Ждём</h2>
 <div class="dots"><span></span><span></span><span></span></div><div class="chips">${w.map(i=>`<span class="glass" style="padding:6px 12px;display:flex;gap:8px;align-items:center">${av(P[i],30)}${esc(P[i].name)}</span>`).join('')}</div></div></div>`;
}
function pick(o,cb){
 let sel=-1;
 app.innerHTML=`<div class="screen">${hdr(o.v)}<h2>${o.title}</h2><p class="mut">${o.sub}</p>
 ${o.clue?'<input id="clue" maxlength="60" placeholder="Твоя подсказка: слово, фраза, звук…">':''}
 <div class="grid">${o.cards.map((id,i)=>`<div class="pc ${i===o.dis?'off':''}" data-i="${i}" style="--i:${i}">${o.num?`<span class="n">${i+1}</span>`:''}${cardEl(cardOf(id))}</div>`).join('')}</div>
 <button class="big" id="ok" disabled>Выбрать</button></div>`;
 const ok=document.getElementById('ok'),cl=document.getElementById('clue');
 const upd=()=>ok.disabled=sel<0||(cl&&!cl.value.trim());
 if(cl)cl.oninput=upd;
 app.querySelectorAll('.pc').forEach(el=>el.onclick=()=>{sel=+el.dataset.i;app.querySelectorAll('.pc').forEach(x=>x.classList.toggle('sel',x===el));upd()});
 ok.onclick=()=>{ok.disabled=true;ok.textContent='Отправлено…';cb(sel,cl&&cl.value.trim())};
}
function reveal(v){
 const r=v.rev,w=v.w,n=P.length,vs=Object.entries(r.votes).map(([p,c])=>[+p,c]);
 const note=r.nf===0?'Никто не угадал — рассказчик 0, остальным по 2.':r.nf===n-1?'Все угадали — рассказчик 0, остальным по 2.':'Рассказчик и угадавшие получают по 3.';
 const order=P.map((_,i)=>i).sort((a,b)=>v.sc[b]-v.sc[a]);
 app.innerHTML=`<div class="screen"><h1 class="logo">«${esc(v.clue)}»</h1><p class="mut">${note} Голоса за чужую карту дают её автору +1.</p>
 <div class="grid">${r.table.map((t,i)=>`<div><div class="pc rv" style="--i:${i};${t.o===w?'box-shadow:0 0 0 4px #ffc400,0 0 30px #ffc40088':''}"><span class="n">${i+1}</span>${cardEl(cardOf(t.c))}</div>
 <div class="cap">${t.o===w?'<span class="star">★ рассказчик</span><br>':''}${av(P[t.o],26)} ${esc(P[t.o].name)}</div>
 <div class="chips">${vs.filter(x=>x[1]===i).map(x=>av(P[x[0]],28)).join('')}</div></div>`).join('')}</div>
 <h2>Счёт</h2>${order.map((i,k)=>`<div class="glass sc" style="--i:${k}">${av(P[i],36)}${esc(P[i].name)}${r.d[i]?` <span class="star">+${r.d[i]}</span>`:''}<b class="r">${v.sc[i]}</b></div>`).join('')}
 ${isHost?`<button class="big" onclick="hNext()">${v.r+1>=v.total?'Итоги 🏆':'Дальше →'}</button>`:'<p class="mut center">Ждём, пока хост нажмёт «Дальше»…</p>'}</div>`;
}
function confetti(){for(let i=0;i<60;i++){const b=document.createElement('b');b.className='cf';b.style.cssText=`left:${Math.random()*100}vw;background:${["#d4a84b","#f2d98f","#c2402f","#4fae7b","#ebe6da"][Math.random()*5|0]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()}s`;document.body.appendChild(b);setTimeout(()=>b.remove(),7000)}}
function finish(v){
 const order=P.map((_,i)=>i).sort((a,b)=>v.sc[b]-v.sc[a]);
 app.innerHTML=`<div class="screen"><div class="gate" style="padding:4vh 0"><div style="font-size:70px">🏆</div>${av(P[order[0]],130)}<h1 class="logo">${esc(P[order[0]].name)} побеждает!</h1></div>
 ${order.map((i,k)=>`<div class="glass sc" style="--i:${k}"><span>${k+1}.</span>${av(P[i],36)}${esc(P[i].name)}<b class="r">${v.sc[i]}</b></div>`).join('')}
 ${isHost?'<button class="big" onclick="hStart()">Ещё раз</button><button class="big ghost" onclick="hLobby()">В лобби</button>':'<p class="mut center">Ждём хоста…</p>'}</div>`;
 confetti();
}
